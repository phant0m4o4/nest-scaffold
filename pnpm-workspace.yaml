packages:
  - apps/*
  - packages/*

# pnpm v11 项目配置（原 package.json#pnpm 迁至此）
#
# minimumReleaseAge：新发布包需满 N 分钟才可解析进 lockfile（默认 1440=1 天，防供应链投毒）
# allowBuilds：仅允许列出的依赖跑 install 脚本（默认全拒；native/bindgen 包必须显式放行）
overrides:
  ioredis: ^6.0.0
  multer: ^2.3.0
  qs: ^6.16.0
  'esbuild@<=0.24.2': ^0.25.0
allowBuilds:
  '@swc/core': true
  argon2: true
  # drizzle-kit / nest 构建链路
  esbuild: true
  # BullMQ 可选原生加速
  msgpackr-extract: true
  # testcontainers → dockerode → ssh2
  ssh2: true
  cpu-features: true
  # nest/protobuf 链路偶发 postinstall
  protobufjs: true
  # Expo ESLint 的原生模块解析器
  unrs-resolver: true

# Nest CLI 的 Angular 工具使用 chokidar 4；SWC 独立监听器需要 5，分别解析。
packageExtensions:
  '@swc/cli@0.8.x':
    optionalDependencies:
      chokidar: ^5.0.0
