# 持续交付：手动触发，构建生产镜像并推送到 GitHub Container Registry (ghcr.io)
#
# 本仓库是脚手架，不自动发布镜像；本工作流仅手动触发，主要用于验证镜像构建
# 与按需出一个镜像。下游业务项目可按自己的发布流程改为标签触发：
#   on: { push: { tags: ['v*'] } }  并配合 type=semver 标签规则
name: CD

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: '镜像标签（如 0.1.0；留空则仅打 commit sha 标签）'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}
            type=sha

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
