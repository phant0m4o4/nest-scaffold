# 持续集成：lint + 构建 + 单元测试 + 集成测试 + 生产镜像 E2E（端到端测试）
# testcontainers 使用 runner 自带 Docker
# docker 任务构建并加载生产镜像，再复用该镜像验证启动与停机，不推送镜像
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的新推送取消进行中的旧运行，避免浪费额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 版本取自 package.json 的 packageManager 字段

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Lint（只读检查）
        run: pnpm lint:check

      - name: 构建（SWC + tsc 类型检查）
        run: pnpm build

      - name: 单元测试（含覆盖率阈值检查）
        run: pnpm test:unit:cov

      - name: 集成测试（testcontainers）
        run: pnpm test:integration

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建并加载生产镜像（不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: nest-scaffold:e2e
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装测试依赖
        run: pnpm install --frozen-lockfile

      - name: 生产镜像 E2E（端到端测试）
        env:
          E2E_APP_IMAGE: nest-scaffold:e2e
        run: pnpm test:e2e
