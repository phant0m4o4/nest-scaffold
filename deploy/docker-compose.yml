# NestJS 本地开发依赖与管理界面，不用于生产部署
services:
  mysql:
    container_name: ${APP_NAME}-mysql
    image: mysql:9
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nest-scaffold}
    ports:
      - '127.0.0.1:${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          '127.0.0.1',
          '-p${MYSQL_PASSWORD:-root_password}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nestjs

  phpmyadmin:
    container_name: ${APP_NAME}-phpmyadmin
    image: phpmyadmin:5
    restart: always
    ports:
      - '127.0.0.1:8081:80'
    environment:
      PMA_HOST: mysql # 指向上方 mysql 服务名
      # 容器网络内始终连接 MySQL 的容器端口，不能使用宿主机映射端口
      PMA_PORT: 3306
      PMA_USER: 'root'
      PMA_PASSWORD: ${MYSQL_PASSWORD:-root_password}
      UPLOAD_LIMIT: 100000000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - nestjs

  postgres:
    container_name: ${APP_NAME}-postgres
    image: postgres:18
    restart: always
    environment:
      POSTGRES_DB: ${PGSQL_DATABASE:-nest-scaffold}
      POSTGRES_USER: ${PGSQL_USER:-postgres}
      POSTGRES_PASSWORD: ${PGSQL_PASSWORD:-root_password}
    ports:
      - '127.0.0.1:${PGSQL_PORT:-5432}:5432'
    volumes:
      # PG 18+ 官方镜像 VOLUME 改为 /var/lib/postgresql（不再是 .../data）
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${PGSQL_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nestjs

  pgadmin:
    container_name: ${APP_NAME}-pgadmin
    image: dpage/pgadmin4:9
    restart: always
    ports:
      - '127.0.0.1:8082:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-root_password}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nestjs

  redis:
    container_name: ${APP_NAME}-redis
    image: redis:8-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password} --appendonly yes
    restart: always
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'redis-cli -a ${REDIS_PASSWORD:-redis_password} ping | grep PONG',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nestjs

  phpRedisAdmin:
    container_name: ${APP_NAME}-phpRedisAdmin
    image: erikdubbelboer/phpredisadmin:1.26
    restart: always
    ports:
      - '127.0.0.1:8080:80'
    environment:
      REDIS_1_HOST: redis
      # 容器网络内始终连接 Redis 的容器端口，不能使用宿主机映射端口
      REDIS_1_PORT: 6379
      REDIS_1_AUTH: ${REDIS_PASSWORD:-redis_password}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nestjs

  seaweedfs:
    container_name: ${APP_NAME}-seaweedfs
    image: chrislusf/seaweedfs:4.47
    command:
      - mini
      - -dir=/data
      - -webdav=false
      - -admin.ui=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
    restart: always
    environment:
      # 仅供本地开发；设置凭据以启用 S3 认证，启动时创建 bucket
      AWS_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-local-storage}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-local-storage-secret}
      S3_BUCKET: ${STORAGE_S3_BUCKET:-nest-scaffold}
    ports:
      - '127.0.0.1:8333:8333'
    volumes:
      - seaweedfs-data:/data
    networks:
      - nestjs

networks:
  nestjs:
    driver: bridge

volumes:
  mysql-data:
  postgres-data:
  redis-data:
  seaweedfs-data:
