# mysql，postgres，redis，phpmyadmin，pgadmin 服务 用于 nestjs 项目（仅限本地开发）
services:
  mysql:
    container_name: ${APP_NAME}-mysql
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    #    image: mysql:5.7
    #    platform: linux/amd64
    #    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nest-scaffold}
    ports:
      - ${MYSQL_PORT:-3306}:3306
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-p${MYSQL_PASSWORD:-root_password}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nestjs

  phpmyadmin:
    container_name: ${APP_NAME}-phpmyadmin
    image: phpmyadmin:5
    restart: always
    ports:
      - '8081:80'
    environment:
      PMA_HOST: mysql # 指向上方 mysql 服务名
      PMA_PORT: ${MYSQL_PORT:-3306}
      PMA_USER: 'root'
      PMA_PASSWORD: ${MYSQL_PASSWORD:-root_password}
      UPLOAD_LIMIT: 100000000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - nestjs

  postgres:
    container_name: ${APP_NAME}-postgres
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${PGSQL_DATABASE:-nest-scaffold}
      POSTGRES_USER: ${PGSQL_USER:-postgres}
      POSTGRES_PASSWORD: ${PGSQL_PASSWORD:-root_password}
    ports:
      - ${PGSQL_PORT:-5432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${PGSQL_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nestjs

  pgadmin:
    container_name: ${APP_NAME}-pgadmin
    image: dpage/pgadmin4:9
    restart: always
    ports:
      - '8082:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-root_password}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nestjs

  redis:
    container_name: ${APP_NAME}-redis
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password} --appendonly yes
    restart: always
    ports:
      - ${REDIS_PORT:-6379}:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a ${REDIS_PASSWORD:-redis_password} ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nestjs

  phpRedisAdmin:
    container_name: ${APP_NAME}-phpRedisAdmin
    image: erikdubbelboer/phpredisadmin
    restart: always
    ports:
      - '8080:80'
    environment:
      REDIS_1_HOST: redis
      REDIS_1_PORT: ${REDIS_PORT:-6379}
      REDIS_1_AUTH: ${REDIS_PASSWORD:-redis_password}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nestjs

networks:
  nestjs:
    driver: bridge

volumes:
  mysql-data:
  postgres-data:
  redis-data:
